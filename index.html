<!DOCTYPE html>
<html>
<head>
    <title>Ear Aware</title>
</head>

<body>

    <h1>Ear Aware</h1>

    <button id="startAudio">Start Microphone</button>

    <p id="status">Microphone not started</p>

    <script>
        const startButton = document.getElementById("startAudio");
        const status = document.getElementById("status");

        let microphoneStream = null;

        startButton.addEventListener("click", async () => {
            try {
                microphoneStream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                status.textContent = "Microphone is working";
                console.log("Microphone stream:", microphoneStream);

            } catch (error) {
                console.error(error);
                status.textContent = "Microphone permission denied/unavailable.";
            }
        });
    </script>
    <section id="captionsSection">

    <h2>Live Captions</h2>

    <button id="captionButton">
        Start Captions
    </button>

    <p id="captionStatus">
        Status: Captions stopped
    </p>

    <div id="captionArea">
        No captions yet.
    </div>

</section>  
<script src="captions.js"></script>
<section id="replaySection">
    <h2>Audio Replay</h2>

    <button id="replayButton">
        Replay Last 10 Seconds
    </button>

    <p id="replayStatus">
        Status: Waiting for audio...
    </p>
</section>
</body>
</html>
